input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # ── Flatten nested [message] hash to top-level fields ───────────────
  # spdlog JSON output wraps structured data under a "message" key:
  #   {"level":"info","name":"cdc-consumers","message":{"event":"redis_updated",...}}
  # We promote all message sub-fields to root so Kibana can aggregate directly.
  if [message] {
    ruby {
      code => '
        msg = event.get("message")
        if msg.is_a?(Hash)
          msg.each { |k, v| event.set(k, v) }
          event.remove("message")
        end
      '
    }
  }

  # ── Numeric type coercions for Kibana percentile/avg aggregations ───
  if [latency_ms]            { mutate { convert => { "latency_ms"            => "float"   } } }
  if [processing_latency_ms] { mutate { convert => { "processing_latency_ms" => "float"   } } }
  if [sink_latency_ms]       { mutate { convert => { "sink_latency_ms"       => "float"   } } }
  if [offset]                { mutate { convert => { "offset"                => "integer" } } }
  if [status_code]           { mutate { convert => { "status_code"           => "integer" } } }
  if [thread_id]             { mutate { convert => { "thread_id"             => "integer" } } }

  # ── Route to dedicated daily indices by event type ──────────────────
  if [event] in ["request_sent", "request_failed", "api_order_created",
                 "api_order_status_updated", "api_cache_hit", "api_cache_miss"] {
    mutate { add_field => { "log_type" => "api" } }
  } else if [event] in ["redis_updated", "es_indexed", "email_notification_sent",
                         "record_processed", "routed_to_dlq",
                         "record_processing_failed", "redis_stale_event_ignored"] {
    mutate { add_field => { "log_type" => "consumer" } }
  } else {
    mutate { add_field => { "log_type" => "system" } }
  }

  mutate { add_field => { "ingest_time" => "%{@timestamp}" } }
}

output {
  if [log_type] == "api" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "cdc-api-logs-%{+YYYY.MM.dd}"
    }
  } else if [log_type] == "consumer" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "cdc-consumer-logs-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "cdc-system-logs-%{+YYYY.MM.dd}"
    }
  }
}
